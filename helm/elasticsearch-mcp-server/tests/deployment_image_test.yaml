suite: "Deployment - image configuration"
templates:
  - templates/deployment.yaml
release:
  name: test
chart:
  appVersion: "2.1.4"
tests:

  - it: should default to the app version with a v prefix
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cr7258/elasticsearch-mcp-server:v2.1.4

  - it: should use the configured image repository and tag
    set:
      image.repository: registry.example.com/custom-mcp-server
      image.tag: custom-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/custom-mcp-server:custom-tag
