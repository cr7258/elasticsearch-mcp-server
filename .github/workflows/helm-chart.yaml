name: Helm Chart

on:
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.3.2 --verify=false

      - name: Lint chart
        run: helm lint helm/elasticsearch-mcp-server

      - name: Run unit tests
        run: helm unittest helm/elasticsearch-mcp-server

  publish:
    name: Publish to OCI Registry
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package helm/elasticsearch-mcp-server

      - name: Push chart to OCI registry
        run: helm push elasticsearch-mcp-server-*.tgz oci://ghcr.io/cr7258/charts
