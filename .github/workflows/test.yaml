name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-tests:
    name: Package Tests (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: elasticsearch-mcp-server-es7
            elasticsearch_version: "7.13.0"
          - name: elasticsearch-mcp-server
            elasticsearch_version: "8.17.2"
          - name: elasticsearch-mcp-server-es9
            elasticsearch_version: "9.0.0"
          - name: opensearch-mcp-server
            elasticsearch_version: "8.17.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install test dependencies
        run: uv sync --group dev
      - name: Build package variant
        run: |
          sed -i 's/^name = .*$/name = "${{ matrix.variant.name }}"/' pyproject.toml
          sed -i 's/elasticsearch==.*/elasticsearch==${{ matrix.variant.elasticsearch_version }}",/' pyproject.toml
          if [[ "${{ matrix.variant.name }}" != "opensearch-mcp-server" ]]; then
            sed -i 's/^elasticsearch-mcp-server = /"${{ matrix.variant.name }}" = /' pyproject.toml
          fi
          uv build
      - name: Test installed wheel
        run: >-
          uv run --no-sync pytest tests/e2e/package -v
          --package-wheel dist/*.whl
          --package-entrypoint "${{ matrix.variant.name }}"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest -m unit

  helm-tests:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.3.2 --verify=false

      - name: Lint chart
        run: helm lint helm/elasticsearch-mcp-server

      - name: Run Helm unit tests
        run: helm unittest helm/elasticsearch-mcp-server

  service-e2e-tests:
    name: Service E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Raise vm.max_map_count for search engines
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pull search engine images
        run: |
          for image in \
            docker.elastic.co/elasticsearch/elasticsearch:8.17.2 \
            opensearchproject/opensearch:2.11.0
          do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 10
            done
          done

      - name: Run e2e tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest tests/e2e/containers -m e2e -vv

  kind-e2e-tests:
    name: Kubernetes E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Raise vm.max_map_count for search engines
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Pull kind and search engine images
        run: |
          for image in \
            docker/dockerfile:1 \
            kindest/node:v1.31.0 \
            docker.elastic.co/elasticsearch/elasticsearch:8.17.2 \
            opensearchproject/opensearch:2.11.0
          do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 10
            done
          done

      - name: Run Kubernetes e2e tests
        env:
          KIND_CLUSTER_NAME: elasticsearch-mcp-server-e2e
          KIND_E2E_IMAGE_REPOSITORY: elasticsearch-mcp-server
          KIND_E2E_IMAGE_TAG: e2e
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest -m k8s -vv
